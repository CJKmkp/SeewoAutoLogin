name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    uses: InkCanvasForClass/community/.github/workflows/plugin-build.yml@net6
    with:
      project: SeewoAutoLogin.csproj
      plugin_id: com.icc.seewo-autologin
      plugin_name: 希沃自动登录
      plugin_description: '支持希沃官方二维码登录、多账号管理和 SSO 快捷登录'
      create_release: true
      release_tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
